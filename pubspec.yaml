name: planazo
description: App social para organizar juntadas presenciales en Buenos Aires.
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── Estado y navegación ───────────────────────────────
  provider: ^6.1.1
  go_router: ^13.0.0

  # ─── Backend real ──────────────────────────────────────
  supabase_flutter: ^2.5.0      # Auth + DB + Realtime + Storage
  postgrest: ^2.0.0             # Incluido en supabase_flutter
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # ─── Mapa y geolocalización ────────────────────────────
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  flutter_map_cancellable_tile_provider: ^2.0.0

  # ─── Cámara y archivos (verificación DNI) ──────────────
  image_picker: ^1.0.7
  permission_handler: ^11.3.0

  # ─── Almacenamiento local ──────────────────────────────
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0  # Para guardar tokens de forma segura

  # ─── Utilidades ────────────────────────────────────────
  uuid: ^4.3.3
  intl: ^0.19.0
  timeago: ^3.6.1
  cached_network_image: ^3.3.1
  path_provider: ^2.1.2
  http: ^1.2.0
  equatable: ^2.0.5            # Comparación de objetos por valor

  # ─── UI ────────────────────────────────────────────────
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
#  assets:
#    - assets/images/
#    - assets/icons/
#    - .env                      # Variables de entorno (Supabase keys)
